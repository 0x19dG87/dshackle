name: Build and Push Docker Image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'

      - name: Build foundation
        run: cd foundation && ../gradlew build publishToMavenLocal

      - name: Build base image
        run: docker build -t drpc-dshackle .

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Jib to local Docker
        run: ./gradlew jibDockerBuild -Pdocker=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}

      - name: Push to ghcr.io
        run: |
          REPO="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dshackle"
          docker push ${REPO}:snapshot
          docker push ${REPO}:latest
          docker images --format '{{.Repository}}:{{.Tag}}' | grep "^${REPO}:" | xargs -I {} docker push {}
