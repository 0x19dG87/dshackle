name: Build and Push Docker Image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build foundation
        run: cd foundation && ../gradlew build publishToMavenLocal

      - name: Build base image
        run: docker build -t drpc-dshackle .

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: ./gradlew jib -Pdocker=ghcr.io/${{ github.repository_owner }}
        env:
          DOCKERHUB_USERNAME: ${{ github.actor }}
          DOCKERHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
